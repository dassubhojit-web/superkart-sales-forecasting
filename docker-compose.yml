services:
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "7860:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    container_name: frontend
    environment:
      BACKEND_URL: http://backend:7860
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
